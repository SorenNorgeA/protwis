{% extends "home/base.html" %}

{% block addon_css %}
<style>
.cv-detail {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 10px 8px 32px;
}

.cv-detail-card {
  position: relative;
  border: 1px solid #d9e2ef;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 10px 24px rgba(31, 120, 180, 0.08);
  overflow: hidden;
}

.cv-detail-tabs-bar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 0 8px;
  background: #f8fbfe;
  border-bottom: 1px solid #d9e2ef;
}

.cv-detail-tabs {
  border-bottom: 0;
  padding: 0;
  background: transparent;
  flex: 1 1 auto;
}

.cv-detail-tabs > li > a {
  margin-top: 10px;
}

.cv-detail-tabs.is-disabled {
  opacity: 0.6;
}

.cv-detail-tabs.is-disabled > li > a {
  pointer-events: none;
  cursor: default;
}

.cv-detail-title-inline {
  flex: 0 0 auto;
  padding: 0 4px 10px 12px;
  font-size: 20px;
  line-height: 1.2;
  font-weight: 600;
  color: #3f5368;
  text-align: right;
}

.cv-detail-body {
  padding: 12px 8px;
  overflow: hidden;
}

.cv-detail-body .tab-pane {
  overflow: hidden;
}

.cv-detail-wheel-panel {
  display: none;
}

.cv-detail-wheel-panel.is-active {
  display: block;
}

.cv-detail-wheel-toggle-wrap {
  display: flex;
  justify-content: center;
  padding: 8px 0 4px;
}

.cv-detail-wheel-toggle {
  border: 1px solid #2e6da4;
  border-radius: 999px;
  background: #337ab7;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  padding: 10px 18px;
  transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}

.cv-detail-wheel-toggle:hover,
.cv-detail-wheel-toggle:focus {
  background: #286090;
  border-color: #204d74;
  color: #fff;
  text-decoration: none;
  outline: none;
}

.cv-detail-frame {
  width: 100%;
  border: 0;
  background: #fff;
  display: block;
  overflow: hidden;
}

.cv-detail-loading-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(248, 251, 254, 0.92);
  z-index: 20;
  transition: opacity 0.18s ease;
}

.cv-detail-loading-overlay.is-hidden {
  opacity: 0;
  pointer-events: none;
}

.cv-detail-loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: #486177;
  text-align: center;
}

.cv-detail-loading-spinner {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  border: 3px solid #d3e1f0;
  border-top-color: #4f86c6;
  animation: cv-detail-spin 0.8s linear infinite;
}

@keyframes cv-detail-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.cv-detail-loading-message.is-error {
  color: #9f3a38;
}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid cv-detail">
  <div class="cv-detail-card">
    <div id="cvSuperfamilyLoadingOverlay" class="cv-detail-loading-overlay">
      <div class="cv-detail-loading-state">
        <div class="cv-detail-loading-spinner" aria-hidden="true"></div>
        <div id="cvSuperfamilyLoadingMessage" class="cv-detail-loading-message">Loading all superfamily views…</div>
      </div>
    </div>
    <div class="cv-detail-tabs-bar">
      <ul id="cvSuperfamilyTabs" class="nav nav-tabs cv-detail-tabs is-disabled" role="tablist" aria-disabled="true">
        <li role="presentation" class="active">
          <a href="#cv-superfamily-wheel-tab" aria-controls="cv-superfamily-wheel-tab" role="tab" data-toggle="tab">GPCRome wheel</a>
        </li>
        <li role="presentation">
          <a href="#cv-superfamily-cluster-tab" aria-controls="cv-superfamily-cluster-tab" role="tab" data-toggle="tab">Cluster</a>
        </li>
        <li role="presentation">
          <a href="#cv-superfamily-matrix-tab" aria-controls="cv-superfamily-matrix-tab" role="tab" data-toggle="tab">Matrix</a>
        </li>
      </ul>
      <div class="cv-detail-title-inline">{{ page_title }}</div>
    </div>

    <div class="tab-content cv-detail-body">
      <div role="tabpanel" class="tab-pane active" id="cv-superfamily-wheel-tab">
        <div id="cvSuperfamilyWheelClassicPanel" class="cv-detail-wheel-panel is-active" data-wheel-variant="classic">
          <iframe
            id="cvSuperfamilyWheelClassicFrame"
            class="cv-detail-frame cv-detail-frame--wheel"
            data-src="{{ wheel_classic_url }}"
            title="{{ page_title }} GPCRome wheel"
            data-initial-height="1240"
            scrolling="no"
            loading="eager"
          ></iframe>
        </div>
        <div id="cvSuperfamilyWheelOdorantPanel" class="cv-detail-wheel-panel" data-wheel-variant="odorant">
          <iframe
            id="cvSuperfamilyWheelOdorantFrame"
            class="cv-detail-frame cv-detail-frame--wheel"
            data-src="{{ wheel_odorant_url }}"
            title="{{ page_title }} odorant GPCR wheel"
            data-initial-height="1240"
            scrolling="no"
            loading="eager"
          ></iframe>
        </div>
        <div class="cv-detail-wheel-toggle-wrap">
          <button
            type="button"
            id="cvSuperfamilyWheelToggle"
            class="cv-detail-wheel-toggle"
            aria-controls="cvSuperfamilyWheelClassicPanel cvSuperfamilyWheelOdorantPanel"
            aria-pressed="false"
          >
            To view olfactory receptors (O1/O2) click here
          </button>
        </div>
      </div>

      <div role="tabpanel" class="tab-pane" id="cv-superfamily-cluster-tab">
        <iframe
          id="cvSuperfamilyClusterFrame"
          class="cv-detail-frame"
          data-src="{{ cluster_url }}"
          title="{{ page_title }} cluster"
          data-initial-height="980"
          scrolling="no"
          loading="eager"
        ></iframe>
      </div>

      <div role="tabpanel" class="tab-pane" id="cv-superfamily-matrix-tab">
        <iframe
          id="cvSuperfamilyMatrixFrame"
          class="cv-detail-frame"
          data-src="{{ matrix_url }}"
          title="{{ page_title }} matrix"
          data-initial-height="1080"
          scrolling="no"
          loading="eager"
        ></iframe>
      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block addon_js %}
<script>
(function() {
  const FRAME_IDS = [
    "cvSuperfamilyWheelClassicFrame",
    "cvSuperfamilyWheelOdorantFrame",
    "cvSuperfamilyClusterFrame",
    "cvSuperfamilyMatrixFrame"
  ];
  const WHEEL_TOGGLE_BUTTON_ID = "cvSuperfamilyWheelToggle";
  const WHEEL_VARIANTS = {
    classic: {
      panelId: "cvSuperfamilyWheelClassicPanel",
      frameId: "cvSuperfamilyWheelClassicFrame",
      toggleText: "To view olfactory receptors (O1/O2) click here",
      pressed: "false"
    },
    odorant: {
      panelId: "cvSuperfamilyWheelOdorantPanel",
      frameId: "cvSuperfamilyWheelOdorantFrame",
      toggleText: "Back to GPCRome wheel",
      pressed: "true"
    }
  };
  let activeWheelVariant = "classic";

  function anchoredFrameHeight(doc, selector) {
    if (!doc || !selector) return 0;
    const anchor = doc.querySelector(selector);
    if (!anchor) return 0;
    const body = doc.body;
    const html = doc.documentElement;
    const bodyTop = body ? body.getBoundingClientRect().top : 0;
    const htmlTop = html ? html.getBoundingClientRect().top : 0;
    const topBase = Math.min(bodyTop || 0, htmlTop || 0);
    const rect = anchor.getBoundingClientRect();
    return Math.ceil(rect.bottom - topBase);
  }

  function resizeFrame(frame) {
    if (!frame) return;
    const initialHeight = Number(frame.getAttribute("data-initial-height") || 960) || 960;
    if (!frame.contentWindow || !frame.contentWindow.document) {
      frame.style.height = initialHeight + "px";
      return;
    }
    try {
      const doc = frame.contentWindow.document;
      const body = doc.body;
      const html = doc.documentElement;
      const anchoredSelector = frame.id === "cvSuperfamilyWheelClassicFrame"
        ? "#GPCRomewheel_classic_tab"
        : (frame.id === "cvSuperfamilyWheelOdorantFrame"
          ? "#GPCRomewheel_odorant_tab"
          : (frame.id === "cvSuperfamilyClusterFrame"
            ? ".ncct-page"
            : (frame.id === "cvSuperfamilyMatrixFrame" ? ".page-wrap" : "")));
      const anchoredHeight = anchoredSelector
        ? anchoredFrameHeight(doc, anchoredSelector)
        : 0;
      const measuredHeight = anchoredHeight || Math.max(
        body ? body.scrollHeight : 0,
        html ? html.scrollHeight : 0,
        0
      );
      const nextHeight = measuredHeight > 0 ? measuredHeight : initialHeight;
      frame.style.height = (nextHeight + 24) + "px";
    } catch (err) {
      frame.style.height = initialHeight + "px";
    }
  }

  function ensureFrameSource(frame) {
    if (!frame) return;
    const deferredSrc = frame.getAttribute("data-src");
    if (deferredSrc && !frame.getAttribute("src")) {
      frame.setAttribute("src", deferredSrc);
    }
  }

  function wireFrame(frameId) {
    const frame = document.getElementById(frameId);
    if (!frame) return;
    frame.addEventListener("load", function() {
      resizeFrame(frame);
      window.setTimeout(function() { resizeFrame(frame); }, 300);
      window.setTimeout(function() { resizeFrame(frame); }, 1000);
      window.setTimeout(function() { resizeFrame(frame); }, 1800);
    });
    frame.addEventListener("cv:content-resize", function() {
      resizeFrame(frame);
      window.setTimeout(function() { resizeFrame(frame); }, 80);
      window.setTimeout(function() { resizeFrame(frame); }, 240);
    });
  }

  function activeWheelFrame() {
    const config = WHEEL_VARIANTS[activeWheelVariant] || WHEEL_VARIANTS.classic;
    return document.getElementById(config.frameId);
  }

  function syncWheelPanels() {
    Object.keys(WHEEL_VARIANTS).forEach(function(variantKey) {
      const config = WHEEL_VARIANTS[variantKey];
      const panel = document.getElementById(config.panelId);
      if (!panel) return;
      panel.classList.toggle("is-active", variantKey === activeWheelVariant);
    });
    const toggleButton = document.getElementById(WHEEL_TOGGLE_BUTTON_ID);
    if (toggleButton) {
      const activeConfig = WHEEL_VARIANTS[activeWheelVariant] || WHEEL_VARIANTS.classic;
      toggleButton.textContent = activeConfig.toggleText;
      toggleButton.setAttribute("aria-pressed", activeConfig.pressed);
      toggleButton.classList.toggle("is-odorant", activeWheelVariant === "odorant");
    }
  }

  function resizeActiveWheelFrame() {
    const frame = activeWheelFrame();
    ensureFrameSource(frame);
    window.setTimeout(function() {
      resizeFrame(frame);
    }, 30);
    window.setTimeout(function() {
      resizeFrame(frame);
    }, 260);
  }

  function setActiveWheelVariant(nextVariant) {
    if (!WHEEL_VARIANTS[nextVariant] || nextVariant === activeWheelVariant) return;
    activeWheelVariant = nextVariant;
    syncWheelPanels();
    resizeActiveWheelFrame();
  }

  function wireWheelToggle() {
    const toggleButton = document.getElementById(WHEEL_TOGGLE_BUTTON_ID);
    if (!toggleButton) return;
    syncWheelPanels();
    toggleButton.addEventListener("click", function() {
      setActiveWheelVariant(activeWheelVariant === "classic" ? "odorant" : "classic");
    });
  }

  function setTabsEnabled(enabled) {
    const tabs = document.getElementById("cvSuperfamilyTabs");
    if (!tabs) return;
    tabs.classList.toggle("is-disabled", !enabled);
    tabs.setAttribute("aria-disabled", enabled ? "false" : "true");
  }

  function hideLoadingOverlay() {
    const overlay = document.getElementById("cvSuperfamilyLoadingOverlay");
    if (!overlay) return;
    overlay.classList.add("is-hidden");
    window.setTimeout(function() {
      overlay.style.display = "none";
    }, 220);
  }

  function showLoadingError(messageText) {
    const message = document.getElementById("cvSuperfamilyLoadingMessage");
    if (message) {
      message.textContent = messageText || "Some superfamily views failed to load.";
      message.classList.add("is-error");
    }
  }

  const pendingFrames = {};
  let pendingCount = 0;
  let failedCount = 0;

  function markFrameSettled(frameId, ok) {
    if (!pendingFrames[frameId]) return;
    delete pendingFrames[frameId];
    pendingCount = Math.max(0, pendingCount - 1);
    if (!ok) failedCount += 1;
    if (pendingCount === 0) {
      setTabsEnabled(true);
      if (failedCount > 0) {
        showLoadingError(failedCount === 1
          ? "One superfamily view failed to load."
          : (String(failedCount) + " superfamily views failed to load."));
        window.setTimeout(function() {
          hideLoadingOverlay();
        }, 900);
      } else {
        hideLoadingOverlay();
      }
    }
  }

  FRAME_IDS.forEach(function(frameId) {
    wireFrame(frameId);
    const frame = document.getElementById(frameId);
    if (!frame) return;
    pendingFrames[frameId] = true;
    pendingCount += 1;
    frame.addEventListener("load", function onInitialLoad() {
      markFrameSettled(frameId, true);
      frame.removeEventListener("load", onInitialLoad);
    });
    frame.addEventListener("error", function onInitialError() {
      markFrameSettled(frameId, false);
      frame.removeEventListener("error", onInitialError);
    });
    ensureFrameSource(frame);
    window.setTimeout(function() {
      resizeFrame(frame);
    }, 60);
  });

  wireWheelToggle();

  $('a[data-toggle="tab"]').on('shown.bs.tab', function (event) {
    const targetSelector = $(event.target).attr('href');
    if (!targetSelector) return;
    if (targetSelector === "#cv-superfamily-wheel-tab") {
      resizeActiveWheelFrame();
      return;
    }
    const pane = document.querySelector(targetSelector);
    if (!pane) return;
    const frame = pane.querySelector('iframe');
    ensureFrameSource(frame);
    window.setTimeout(function() {
      resizeFrame(frame);
    }, 30);
    window.setTimeout(function() {
      resizeFrame(frame);
    }, 260);
  });
})();
</script>
{% endblock %}

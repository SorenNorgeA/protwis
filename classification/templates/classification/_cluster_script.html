<script>
(function() {
  const EMBED_URL = "{{ embed_url }}";
  const LAYOUT_MODE = "{{ ncct_layout_mode|default:'default'|escapejs }}";
  const INITIAL_VARIANT = "{{ ncct_initial_variant|default:'max'|escapejs }}";
  const IS_SUPERFAMILY_LAYOUT = LAYOUT_MODE === "superfamily";
  const CLUSTER_ONLY = {% if ncct_cluster_only %}true{% else %}false{% endif %};
  const PAGE_TITLE = "{{ ncct_page_title|default:'Class clusters'|escapejs }}";
  const statusEl = document.getElementById('ncct-status');
  const clusterPlotEl = document.getElementById('ncct-cluster-plot');
  const treeContainerEl = document.querySelector('.ncct-tree-container');
  const classKeyEl = document.getElementById('ncct-class-key');
  const distanceMethodsEl = document.getElementById('ncct-distance-methods');
  const clusterMethodsEl = document.getElementById('ncct-cluster-methods');
  const clusterTitleEl = document.getElementById('ncct-cluster-title');
  const clusterMetaEl = document.getElementById('ncct-cluster-meta');
  const treeMetaEl = document.getElementById('ncct-tree-meta');
  const superfamilyLabelsEl = document.getElementById('ncct-superfamily-labels');
  const superfamilySimilarityTitleEl = document.getElementById('ncct-superfamily-similarity-title');
  const superfamilyHoverEl = document.getElementById('ncct-superfamily-hover');
  let currentDistanceVariant = INITIAL_VARIANT || 'max';
  let currentClusterMethod = 'tsne';
  let currentPayload = null;
  let hoveredClassId = null;

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function titleCaseFragment(value) {
    const normalizedValue = String(value || '').trim().toLowerCase();
    if (normalizedValue === 'tetrapod-specific olfactory receptors') {
      return 'Tetrapod-specific olfactory receptors';
    }
    if (normalizedValue === 'fish-like olfactory receptors') {
      return 'Fish-like olfactory receptors';
    }
    return String(value || '').replace(/\b([A-Za-z][A-Za-z'-]*)/g, function(match) {
      return match.charAt(0).toUpperCase() + match.slice(1).toLowerCase();
    });
  }

  function normalizeClassName(name) {
    return String(name || '')
      .replace('Class O1 (fish-like)', 'Class O1 (fish-like olfactory receptors)')
      .replace('Class O2 (tetrapod specific)', 'Class O2 (tetrapod-specific olfactory receptors)');
  }

  function formattedClassNameHtml(name) {
    const raw = normalizeClassName(name).trim();
    if (!raw) return '';
    const match = raw.match(/^(.*?)(\s*\(([^)]+)\))$/);
    if (!match) return escapeHtml(raw);
    const main = escapeHtml(match[1].trim());
    const secondary = escapeHtml('(' + titleCaseFragment(match[3].trim()) + ')');
    return main + '<span class="ncct-superfamily-secondary">' + secondary + '</span>';
  }

  function formatPercent(value) {
    if (value === null || value === undefined || value === '') return 'n/a';
    const rounded = Math.round(Number(value) * 10) / 10;
    if (!isFinite(rounded)) return 'n/a';
    return (Math.round(rounded) === rounded ? String(Math.round(rounded)) : rounded.toFixed(1)) + '%';
  }

  function variantMatrixFor(variantKey) {
    const variant = ((currentPayload || {}).variants || {})[variantKey] || currentVariantPayload();
    return variant.matrix || ((variant.render_payload || {}).matrix) || [];
  }

  function matrixEntryFor(sourceId, targetId) {
    const matrix = variantMatrixFor(currentDistanceVariant);
    if (!matrix[sourceId] || !matrix[sourceId][targetId]) return null;
    return matrix[sourceId][targetId];
  }

  function buildMarkerSizes(points, activeClassId) {
    return points.map(function(point) {
      if (!IS_SUPERFAMILY_LAYOUT) return 18;
      return point.id === activeClassId ? 48 : 36;
    });
  }

  function buildMarkerOpacities(points, activeClassId) {
    return points.map(function(point) {
      if (!IS_SUPERFAMILY_LAYOUT || activeClassId === null || activeClassId === undefined) return 1;
      return point.id === activeClassId ? 1 : 0.72;
    });
  }

  function buildBasePlotLabels(points, activeClassId) {
    return points.map(function(point) {
      return '<b>' + point.symbol + '</b>';
    });
  }

  function buildLabelSizes(points, activeClassId) {
    return points.map(function(point) {
      if (!IS_SUPERFAMILY_LAYOUT) return 14;
      return point.id === activeClassId ? 28 : 14;
    });
  }

  function setActiveSuperfamilyLabel(classId) {
    if (!superfamilyLabelsEl) return;
    const buttons = superfamilyLabelsEl.querySelectorAll('.ncct-superfamily-label');
    Array.prototype.forEach.call(buttons, function(button) {
      const isActive = Number(button.getAttribute('data-class-id')) === classId;
      button.classList.toggle('is-active', isActive);
    });
  }

  function updateSuperfamilySimilarityTitle(classId) {
    if (!superfamilySimilarityTitleEl) return;
    const classes = (currentPayload || {}).classes || [];
    const classRow = classes[classId];
    if (!classRow) {
      superfamilySimilarityTitleEl.textContent = 'Similarity ranking';
      return;
    }
    const classSymbol = escapeHtml(classRow.symbol || '');
    const formattedName = formattedClassNameHtml(classRow.name || classRow.symbol || '');
    const secondaryMatch = formattedName.match(/<span class="ncct-superfamily-secondary">([\s\S]+?)<\/span>/);
    const secondaryHtml = secondaryMatch ? secondaryMatch[0] : '';
    if (classSymbol) {
      superfamilySimilarityTitleEl.innerHTML = 'Class ' + classSymbol + ' similarity ranking' + secondaryHtml;
      return;
    }
    superfamilySimilarityTitleEl.textContent = 'Class similarity ranking';
  }

  function renderSuperfamilyHoverCard(classId) {
    if (!superfamilyHoverEl) return;
    const classes = (currentPayload || {}).classes || [];
    const classRow = classes[classId];
    if (!classRow) {
      superfamilyHoverEl.innerHTML = '<p class="ncct-superfamily-hover-empty">Hover a class point to inspect its max similarity against the rest of the GPCR superfamily.</p>';
      return;
    }

    const peers = [];
    classes.forEach(function(otherClass, otherId) {
      if (otherId === classId) return;
      const cell = matrixEntryFor(classId, otherId) || {};
      peers.push({
        id: otherId,
        symbol: otherClass.symbol,
        name: otherClass.name,
        color: otherClass.color || '#808080',
        similarity: cell.similarity,
        similarityDisplay: cell.similarity_display,
        distance: cell.distance,
      });
    });
    peers.sort(function(a, b) {
      const simA = (a.similarity === null || a.similarity === undefined) ? -Infinity : Number(a.similarity);
      const simB = (b.similarity === null || b.similarity === undefined) ? -Infinity : Number(b.similarity);
      return simB - simA;
    });

    const rowsHtml = peers.map(function(peer) {
      return (
        '<div class="ncct-superfamily-hover-row">' +
          '<div class="ncct-superfamily-hover-label">' +
            '<span class="ncct-superfamily-label-swatch" style="background:' + peer.color + ';"></span>' +
            '<div class="ncct-superfamily-hover-text"><strong>' + peer.symbol + '</strong></div>' +
          '</div>' +
          '<div class="ncct-superfamily-hover-metric ncct-superfamily-hover-value-box">' +
            '<div class="ncct-superfamily-hover-metric-label">Similarity</div>' +
            '<div class="ncct-superfamily-hover-metric-value ncct-superfamily-hover-value">' + escapeHtml(peer.similarityDisplay || formatPercent(peer.similarity)) + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    superfamilyHoverEl.innerHTML = '<div class="ncct-superfamily-hover-list">' + rowsHtml + '</div>';
  }

  function updateSuperfamilyPointHighlight(classId) {
    if (!IS_SUPERFAMILY_LAYOUT || !clusterPlotEl || !currentPayload) return;
    const variant = currentVariantPayload();
    const scatter = variant.scatter || {};
    const methods = scatter.methods || {};
    const methodPayload = methods[currentClusterMethod] || { points: [] };
    const points = methodPayload.points || [];
    if (!points.length) return;
    const markerSizes = buildMarkerSizes(points, classId);
    const markerLineWidths = points.map(function(point) { return point.id === classId ? 2.5 : 1; });
    const markerOpacities = buildMarkerOpacities(points, classId);
    Plotly.restyle(clusterPlotEl, {
      'marker.size': [markerSizes],
      'marker.line.width': [markerLineWidths],
      'marker.opacity': [markerOpacities],
    }, [0]);
    Plotly.restyle(clusterPlotEl, {
      text: [buildBasePlotLabels(points, classId)],
      'textfont.size': [buildLabelSizes(points, classId)],
    }, [1]);
  }

  function setHoveredClass(classId) {
    hoveredClassId = classId;
    setActiveSuperfamilyLabel(classId);
    updateSuperfamilySimilarityTitle(classId);
    renderSuperfamilyHoverCard(classId);
    updateSuperfamilyPointHighlight(classId);
  }

  function renderSuperfamilyLabels(classes) {
    if (!superfamilyLabelsEl) return;
    superfamilyLabelsEl.innerHTML = '';
    (classes || []).forEach(function(cls, idx) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'ncct-superfamily-label';
      button.setAttribute('data-class-id', idx);
      button.innerHTML =
        '<span class="ncct-superfamily-label-marker">' +
          '<span class="ncct-superfamily-label-swatch" style="background:' + (cls.color || '#808080') + ';"></span>' +
          '<span class="ncct-superfamily-label-symbol">' + (cls.symbol || '') + '</span>' +
        '</span>' +
        '<span class="ncct-superfamily-label-text">' + formattedClassNameHtml(cls.name) + '</span>';
      button.addEventListener('mouseenter', function() {
        setHoveredClass(idx);
      });
      button.addEventListener('focus', function() {
        setHoveredClass(idx);
      });
      superfamilyLabelsEl.appendChild(button);
    });
  }

  function makeClassKey(classes) {
    if (IS_SUPERFAMILY_LAYOUT) {
      classKeyEl.innerHTML = '';
      return;
    }
    classKeyEl.innerHTML = '';
    (classes || []).forEach(cls => {
      const item = document.createElement('div');
      item.className = 'ncct-class-key-item';

      const swatch = document.createElement('span');
      swatch.className = 'ncct-class-key-swatch';
      swatch.style.backgroundColor = cls.color || '#808080';
      item.appendChild(swatch);

      const text = document.createElement('span');
      text.textContent = (cls.symbol || '') + ' - ' + (cls.name || '');
      item.appendChild(text);

      classKeyEl.appendChild(item);
    });
  }

  function clusterMethodLabel(methodKey) {
    const variant = currentVariantPayload();
    const methods = ((variant || {}).scatter || {}).methods || {};
    return (methods[methodKey] && methods[methodKey].label) || methodKey.toUpperCase();
  }

  function distanceVariantLabel(variantKey) {
    const variants = ((currentPayload || {}).variants) || {};
    return (variants[variantKey] && variants[variantKey].label) || variantKey;
  }

  function currentVariantPayload() {
    const variants = ((currentPayload || {}).variants) || {};
    if (variants[currentDistanceVariant]) return variants[currentDistanceVariant];
    const defaultKey = (currentPayload && currentPayload.default_variant) || 'max';
    if (variants[defaultKey]) return variants[defaultKey];
    const firstKey = Object.keys(variants)[0];
    return firstKey ? variants[firstKey] : {};
  }

  function renderCluster(payload, variantKey, methodKey) {
    const variants = payload.variants || {};
    const variant = variants[variantKey] || currentVariantPayload();
    const scatter = variant.scatter || {};
    const methods = scatter.methods || {};
    const method = methods[methodKey] ? methodKey : (scatter.default_method || 'tsne');
    const methodPayload = methods[method] || { points: [] };
    const points = methodPayload.points || [];

    const activeClassId = IS_SUPERFAMILY_LAYOUT ? hoveredClassId : null;

    const trace = {
      type: 'scatter',
      mode: 'markers',
      x: points.map(p => p.x),
      y: points.map(p => p.y),
      customdata: points.map(p => p.id),
      hoverinfo: IS_SUPERFAMILY_LAYOUT ? 'none' : 'skip',
      marker: {
        size: buildMarkerSizes(points, activeClassId),
        color: points.map(p => p.color),
        opacity: buildMarkerOpacities(points, activeClassId),
        line: {
          width: 1,
          color: '#222',
        },
      },
    };

    const labelTrace = {
      type: 'scatter',
      mode: 'text',
      x: points.map(p => p.x),
      y: points.map(p => p.y),
      text: buildBasePlotLabels(points, activeClassId),
      textposition: IS_SUPERFAMILY_LAYOUT ? 'middle center' : 'top center',
      textfont: {
        size: buildLabelSizes(points, activeClassId),
        color: '#111',
        family: 'Source Code Pro, monospace',
      },
      hoverinfo: 'skip',
    };

    const layout = {
      margin: IS_SUPERFAMILY_LAYOUT ? { l: 24, r: 24, t: 12, b: 36 } : { l: 30, r: 20, t: 10, b: 30 },
      paper_bgcolor: '#fff',
      plot_bgcolor: '#fff',
      showlegend: false,
      hovermode: IS_SUPERFAMILY_LAYOUT ? 'closest' : false,
      xaxis: {
        showgrid: false,
        zeroline: false,
        showticklabels: false,
        title: '',
        fixedrange: !!IS_SUPERFAMILY_LAYOUT,
      },
      yaxis: {
        showgrid: false,
        zeroline: false,
        showticklabels: false,
        title: '',
        fixedrange: !!IS_SUPERFAMILY_LAYOUT,
      },
      dragmode: IS_SUPERFAMILY_LAYOUT ? false : 'zoom',
      font: {
        family: 'Source Code Pro, monospace',
        color: '#111',
      },
    };

    const config = {
      responsive: true,
      displayModeBar: false,
      scrollZoom: false,
      doubleClick: false,
    };

    Plotly.newPlot(clusterPlotEl, [trace, labelTrace], layout, config);
    if (IS_SUPERFAMILY_LAYOUT && typeof clusterPlotEl.removeAllListeners === 'function') {
      clusterPlotEl.removeAllListeners('plotly_hover');
      clusterPlotEl.removeAllListeners('plotly_unhover');
    }
    if (IS_SUPERFAMILY_LAYOUT && typeof clusterPlotEl.on === 'function') {
      clusterPlotEl.on('plotly_hover', function(eventData) {
        const pointData = eventData && eventData.points && eventData.points[0];
        if (!pointData) return;
        setHoveredClass(Number(pointData.customdata));
      });
      clusterPlotEl.on('plotly_unhover', function() {
        if (hoveredClassId === null || hoveredClassId === undefined) return;
        setHoveredClass(hoveredClassId);
      });
    }
    if (clusterTitleEl) {
      clusterTitleEl.textContent = PAGE_TITLE;
    }
    clusterMetaEl.textContent = IS_SUPERFAMILY_LAYOUT
      ? ''
      : ('Projection: ' + clusterMethodLabel(method) + ' using ' + distanceVariantLabel(currentDistanceVariant) + '.');
    currentClusterMethod = method;
    if (IS_SUPERFAMILY_LAYOUT) {
      if (hoveredClassId === null || hoveredClassId === undefined) {
        hoveredClassId = points.length ? Number(points[0].id) : null;
      }
      setHoveredClass(hoveredClassId);
    }
  }

  function renderClusterMethodButtons(payload, variantKey) {
    const variant = (payload.variants || {})[variantKey] || currentVariantPayload();
    const scatter = variant.scatter || {};
    const methods = scatter.methods || {};
    clusterMethodsEl.innerHTML = '';
    if (Object.keys(methods).length <= 1) {
      clusterMethodsEl.style.display = 'none';
      return;
    }
    clusterMethodsEl.style.display = '';
    Object.keys(methods).forEach(methodKey => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-sm ' + (methodKey === currentClusterMethod ? 'btn-primary' : 'btn-default');
      btn.textContent = clusterMethodLabel(methodKey);
      btn.addEventListener('click', function() {
        if (methodKey === currentClusterMethod) return;
        renderCluster(payload, currentDistanceVariant, methodKey);
        renderClusterMethodButtons(payload, currentDistanceVariant);
      });
      clusterMethodsEl.appendChild(btn);
    });
  }

  function renderDistanceVariantButtons(payload) {
    if (IS_SUPERFAMILY_LAYOUT) {
      distanceMethodsEl.innerHTML = '';
      distanceMethodsEl.style.display = 'none';
      return;
    }
    const variants = payload.variants || {};
    distanceMethodsEl.innerHTML = '';
    Object.keys(variants).forEach(variantKey => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-sm ' + (variantKey === currentDistanceVariant ? 'btn-primary' : 'btn-default');
      btn.textContent = distanceVariantLabel(variantKey);
      btn.addEventListener('click', function() {
        if (variantKey === currentDistanceVariant) return;
        currentDistanceVariant = variantKey;
        const variant = variants[currentDistanceVariant] || {};
        const scatter = variant.scatter || {};
        if (!((scatter.methods || {})[currentClusterMethod])) {
          currentClusterMethod = scatter.default_method || 'tsne';
        }
        renderDistanceVariantButtons(payload);
        renderCluster(payload, currentDistanceVariant, currentClusterMethod);
        renderClusterMethodButtons(payload, currentDistanceVariant);
        if (!CLUSTER_ONLY) renderTree(payload, currentDistanceVariant);
        renderStatus(payload, currentDistanceVariant);
      });
      distanceMethodsEl.appendChild(btn);
    });
  }

  function renderTree(payload, variantKey) {
    if (!treeContainerEl) return;

    var variant = (payload.variants || {})[variantKey] || currentVariantPayload();
    var tree = variant.tree || {};
    var newick = tree.newick || '';

    if (!newick || newick.trim() === '') {
      treeContainerEl.innerHTML = '<div style="text-align:center;padding:80px 20px;color:#666;">No tree data (need at least 2 classes).</div>';
      treeMetaEl.textContent = '';
      return;
    }

    var colorBySymbol = {};
    (payload.classes || []).forEach(function(cls) {
      colorBySymbol[String(cls.symbol || '')] = cls.color || '#808080';
    });

    if (typeof renderTreeFromNewick === 'function') {
      renderTreeFromNewick(newick, colorBySymbol, '.ncct-tree-container', 580);
    }

    treeMetaEl.textContent = 'Circular dendrogram. Linkage: ' + (tree.linkage_method || 'average') + '. Branch lengths use ' + distanceVariantLabel(currentDistanceVariant) + '.';
  }

  function renderStatus(payload, variantKey) {
    const variant = (payload.variants || {})[variantKey] || currentVariantPayload();
    const meta = variant.meta || {};
    const notes = [];
    notes.push((meta.n_classes || 0) + ' classes');
    notes.push(distanceVariantLabel(variantKey));
    if (meta.missing_pairs) {
      notes.push(String(meta.missing_pairs) + ' missing pairs filled with max observed distance');
    }
    statusEl.textContent = notes.join(' | ');
  }

  async function loadPage() {
    try {
      const res = await fetch(EMBED_URL, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) {
        let detail = '';
        try {
          const err = await res.json();
          if (err && err.error) detail = String(err.error);
        } catch (e) {}
        throw new Error('HTTP ' + res.status + (detail ? ': ' + detail : ''));
      }

      const payload = await res.json();
      currentPayload = payload;
      currentDistanceVariant = (payload.variants || {})[currentDistanceVariant]
        ? currentDistanceVariant
        : (payload.default_variant || 'max');
      const initialVariant = currentVariantPayload();
      currentClusterMethod = ((initialVariant.scatter || {}).default_method) || 'tsne';
      makeClassKey(payload.classes || []);
      if (IS_SUPERFAMILY_LAYOUT) {
        renderSuperfamilyLabels(payload.classes || []);
        renderSuperfamilyHoverCard(null);
      }
      renderDistanceVariantButtons(payload);
      renderCluster(payload, currentDistanceVariant, currentClusterMethod);
      renderClusterMethodButtons(payload, currentDistanceVariant);
      if (!CLUSTER_ONLY) renderTree(payload, currentDistanceVariant);
      renderStatus(payload, currentDistanceVariant);
    } catch (err) {
      statusEl.textContent = 'Failed to load class cluster data.';
      clusterMetaEl.textContent = String(err && err.message ? err.message : err);
      treeMetaEl.textContent = '';
    }
  }

  $('a[data-toggle="tab"]').on('shown.bs.tab', function () {
    try { Plotly.Plots.resize(clusterPlotEl); } catch (e) {}
    if (currentPayload && !CLUSTER_ONLY) renderTree(currentPayload, currentDistanceVariant);
  });

  window.addEventListener('resize', function() {
    try { Plotly.Plots.resize(clusterPlotEl); } catch (e) {}
    if (currentPayload && !CLUSTER_ONLY) renderTree(currentPayload, currentDistanceVariant);
  });

  loadPage();
})();
</script>

{% extends "home/base.html" %}
{% load static %}

{% block addon_css %}
<link rel="stylesheet" href="{% static 'home/css/frameworks/datatables/datatables_bundle-3.1.4_min.css' %}">
<link rel="stylesheet" href="{% static 'home/css/tablemanager.css' %}">
<link rel="stylesheet" href="{% static 'home/css/frameworks/select2/4.1.0/select2.min.css' %}">
{% endblock %}

{% block content %}
<div class="container">

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <table id="gpcrListTable" class="display" style="width:100%">
    <!-- This table is populated by the TableManager via AJAX -->
  </table>
</div>
{% endblock %}

{% block addon_js %}
<script src="{% static 'home/js/frameworks/datatables/datatables_3.1.4_bundle_min.js' %}"></script>
<script src="{% static 'home/js/frameworks/select2/4.1.0/select2.min.js' %}"></script>

<script type="module">
  // Populate the GPCR list table using TableManager
  import { TableManager } from "{% static 'home/js/tablemanager/tablemanager.js' %}";
  TableManager.fetchConfiguration(
    'gpcr_list_table', //dataTableConfigName
    'clientside', //dataTableConfigVariant
    'gpcr_list_table', //columnConfigName
    'basic' //columnConfigVariant
  )
  .then(config => {
    const gpcrListTable = new TableManager(config.columnsSpecifications, 'gpcrListTable');
    gpcrListTable.initialiseDataTable(config.datatableConfiguration);
  }).catch(error => {
    console.error('Error fetching configuration:', error);
  });
</script>
{% endblock %}

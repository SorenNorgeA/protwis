{% extends "home/base.html" %}
{% load static %}
{% load utils %}

{% block content %}
<div class="container">
  <h3>GPCR sequence & structure similarity (t-SNE)</h3>
  <div id="sim-status">Loading…</div>

  <!-- dataset toggle -->
  <div style="margin:8px 0;">
    <span style="margin-right:4px;">Dataset:</span>
    <button class="btn btn-primary btn-sm dataset-btn" data-dataset="sequence">Sequence</button>
    <button class="btn btn-default btn-sm dataset-btn" data-dataset="inactive">Inactive structures</button>
    <button class="btn btn-default btn-sm dataset-btn" data-dataset="active">Active structures</button>
  </div>

  <!-- colour-by controls -->
  <div style="margin:8px 0;">
    <span style="margin-right:4px;">Colour by:</span>
    <button class="btn btn-primary btn-sm colorby" data-key="Class">Class</button>
    <button class="btn btn-default  btn-sm colorby" data-key="Chemotype">Chemotype</button>
    <button class="btn btn-default  btn-sm colorby" data-key="Receptor family">Receptor family</button>
    <button class="btn btn-default  btn-sm colorby" data-key="Modality">Modality</button>
    <button class="btn btn-default  btn-sm colorby" data-key="Sense">Sense</button>
  </div>

  <!-- shape-by controls -->
  <div style="margin:4px 0 8px;">
    <span style="margin-right:4px;">Shape by:</span>
    <button class="btn btn-primary btn-xs shapeby" data-key="None">None</button>
    <button class="btn btn-default btn-xs shapeby" data-key="Class">Class</button>
  </div>

  <!-- class region toggle -->
  <div style="margin:4px 0 12px;">
    <span style="margin-right:4px;">Class regions:</span>
    <button id="class-region-toggle" class="btn btn-primary btn-xs" data-active="1">
      On
    </button>
  </div>

  <!-- NEW: download button -->
  <button id="download-btn" class="btn btn-default btn-xs" style="margin-left:12px;">
    Download SVG
  </button>

  <!-- plot title -->
  <h4 id="plot-title" class="text-center" style="margin: 10px 0 5px;">
    Sequence similarity
  </h4>

  <div id="plot" style="min-height: 540px;"></div>
</div>
{% endblock %}

{% block addon_js %}
<script src="{% static 'home/js/plotly_v1_58_5.js' %}"></script>
<script>
(async function () {
  const statusEl    = document.getElementById('sim-status');
  const plotTitleEl = document.getElementById('plot-title');
  const plotDiv     = document.getElementById('plot');
  const regionBtn   = document.getElementById('class-region-toggle');
  const downloadBtn = document.getElementById('download-btn');   // NEW

  const EMBED_URL = "{{ embed_url }}";

  /* ---------- colour constants ---------- */

  const PALETTE = [
    '#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd',
    '#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf'
  ];

  const CLASS_COLORS = {
    'A':     '#1f77b4',
    'B1':    '#ff7f0e',
    'B2':    '#2ca02c',
    'O1':    '#d62728',
    'O2':    '#9467bd',
    'C':     '#8c564b',
    'F':     '#e377c2',
    'T2':    '#7f7f7f',
    'Other': '#bcbd22'
  };

  const MODALITY_COLORS = {
    'Ion receptors':            '#7570b3',
    'Peptide receptors':        '#1b9e77',
    'Protein receptors':        '#66a61e',
    'Small molecule receptors': '#d95f02',
    'Orphan receptors':         '#7f7f7f',
    'Other':                    '#666666'
  };

  const SENSE_COLORS = {
    'non-sensory': '#1f78b4',
    'odorant':     '#e31a1c',
    'taste':       '#33a02c',
    'vision':      '#6a3d9a',
    'unknown':     '#b2b2b2'
  };

  const CLASS_ORDER = ['A','B1','B2','C','F','O1','O2','T2'];

  /* ---------- helpers ---------- */

  function normalizeModality(raw) {
    let s = (raw || '').toString().trim();
    if (!s) return 'Orphan receptors';
    s = s.replace(/\s+/g, ' ').toLowerCase();

    if (s.includes('ion'))        return 'Ion receptors';
    if (s.includes('peptide'))    return 'Peptide receptors';
    if (s.includes('protein'))    return 'Protein receptors';
    if (s.includes('small') ||
        s.includes('molecule'))   return 'Small molecule receptors';
    if (s.includes('orphan') ||
        s === 'unknown')          return 'Orphan receptors';

    return 'Other';
  }

  function normClassCodeFromString(cls) {
    let s = String(cls || '').toUpperCase();
    if (!s) return 'Other';
    if (s.includes('CLASS B1')) return 'B1';
    if (s.includes('CLASS B2')) return 'B2';
    if (s.includes('CLASS O1')) return 'O1';
    if (s.includes('CLASS O2')) return 'O2';
    if (s.includes('CLASS T2')) return 'T2';
    if (s.includes('CLASS C'))  return 'C';
    if (s.includes('CLASS F'))  return 'F';
    if (s.includes('CLASS A'))  return 'A';
    return s; // already a plain code
  }

  function getCategory(point, key) {
    if (key === 'Modality')
      return point.Modality || 'Unknown';
    if (key === 'Class')
      return point.Class || 'Other';
    if (key === 'Chemotype')
      return point.Chemotype || 'Unknown';
    if (key === 'Receptor family')
      return point['Receptor family'] || 'Unknown';
    if (key === 'Sense')
      return point.Sense || 'unknown';
    return 'Unknown';
  }

  function getShapeCategory(point, shapeKey) {
    if (shapeKey === 'Class')
      return normClassCodeFromString(point.Class);
    // shape-by None
    return 'None';
  }

  function getShapeFor(clsCode, shapeKey) {
    if (shapeKey !== 'Class') {
      return 'circle';   // all circles when shape-by None
    }
    switch (clsCode) {
      case 'A':  return 'circle';
      case 'B1': return 'star-triangle-up';
      case 'B2': return 'star-triangle-down';
      case 'O1': return 'star-square';
      case 'O2': return 'star-diamond';
      case 'C':  return 'pentagon';
      case 'F':  return 'hexagram';
      case 'T2': return 'diamond-wide';
      default:   return 'circle-open';
    }
  }

  function colorForCategory(key, cat, point) {
    if (key === 'Class') {
      const code = normClassCodeFromString(cat);
      return CLASS_COLORS[code] || CLASS_COLORS['Other'] || '#999999';
    }

    if (key === 'Modality') {
      const grp = normalizeModality(cat);
      return MODALITY_COLORS[grp] || '#999999';
    }

    if (key === 'Sense') {
      const s = String(cat || '').toLowerCase();
      if (s in SENSE_COLORS) return SENSE_COLORS[s];
      return SENSE_COLORS['unknown'];
    }

    // Chemotype / Receptor family: colours assigned later by palette
    return null;
  }

  // download plot (SVG) without legend
  downloadBtn.addEventListener('click', async () => {
    if (!plotDiv || !plotDiv.data || !plotDiv.data.length) {
      alert('No plot to download yet.');
      return;
    }

    const origText = downloadBtn.textContent;
    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Preparing…';

    try {
      const layout = plotDiv.layout || {};
      const oldShowLegend = layout.showlegend;

      // hide legend
      await Plotly.relayout(plotDiv, { showlegend: false });

      // export as SVG (tweak width/height if you want)
      const url = await Plotly.toImage(plotDiv, {
        format: 'svg',
        width:  900,
        height: 700
      });

      // restore legend state
      await Plotly.relayout(plotDiv, { showlegend: oldShowLegend });

      // trigger download
      const a = document.createElement('a');
      a.href = url;
      const baseName = (datasetTitle(currentDataset) || 'tsne')
        .replace(/\s+/g, '_')
        .toLowerCase();
      a.download = baseName + '.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

    } catch (e) {
      console.error('Download failed', e);
      alert('Download failed: ' + e.message);
    } finally {
      downloadBtn.disabled = false;
      downloadBtn.textContent = origText;
    }
  });

  /* ---------- build traces ---------- */

  let showClassRegions = true;

  function buildTraces(points, colorKey, shapeKey) {
    const tracesByCombo = new Map();
    const paletteMap = new Map();  // for Chemotype / Receptor family
    let paletteIdx = 0;

    points.forEach(p => {
      const cCat      = getCategory(p, colorKey);
      const shapeCat  = getShapeCategory(p, shapeKey);
      let color       = colorForCategory(colorKey, cCat, p);

      if (color === null) {
        if (!paletteMap.has(cCat)) {
          paletteMap.set(cCat, PALETTE[paletteIdx % PALETTE.length]);
          paletteIdx += 1;
        }
        color = paletteMap.get(cCat);
      }

      const key = cCat + '|' + shapeCat;
      if (!tracesByCombo.has(key)) {
        tracesByCombo.set(key, {
          name: cCat,
          cls:  shapeCat,
          color: color,
          xs: [],
          ys: [],
          texts: []
        });
      }
      const bucket = tracesByCombo.get(key);
      bucket.xs.push(p.x);
      bucket.ys.push(p.y);

      const label    = p.label || '';
      const uni      = p.uniprot || '';
      const modality = p.Modality || '';
      const sense    = p.Sense || '';
      const lines = [];
      if (label)    lines.push('Label: ' + label);
      if (uni)      lines.push('UniProt: ' + uni);
      if (modality) lines.push('Modality: ' + modality);
      if (sense)    lines.push('Sense: ' + sense);
      lines.push(colorKey + ': ' + cCat);
      bucket.texts.push(lines.join('<br>'));
    });

    const traces = [];
    for (const [, b] of tracesByCombo.entries()) {
      traces.push({
        x: b.xs,
        y: b.ys,
        type: 'scatter',
        mode: 'markers',
        marker: {
          size: 9,
          line: { width: 0.5, color: '#000' },
          color: b.color,
          symbol: getShapeFor(b.cls, shapeKey)
        },
        name: b.name,
        hoverinfo: 'text',
        text: b.texts,
        showlegend: true,
        _classCode: b.cls,
        _colorCat: b.name
      });
    }

    // Add class legend only when shapes encode class
    if (shapeKey === 'Class') {
      traces.push({
        x: [NaN],
        y: [NaN],
        type: 'scatter',
        mode: 'markers',
        marker: { size: 0, color: 'rgba(0,0,0,0)' },
        name: '<b>Class (shape)</b>',
        hoverinfo: 'skip',
        showlegend: true
      });

      CLASS_ORDER.forEach(cls => {
        traces.push({
          x: [NaN],
          y: [NaN],
          type: 'scatter',
          mode: 'markers',
          marker: {
            size: 9,
            color: '#000',
            symbol: getShapeFor(cls, 'Class')
          },
          name: cls,
          hoverinfo: 'skip',
          showlegend: true
        });
      });
    }

        // ---------- optional class regions (ellipses + labels) ----------
    if (showClassRegions) {
      const byClass = {};
      points.forEach(p => {
        const code = normClassCodeFromString(p.Class);
        if (!code) return;
        if (!byClass[code]) byClass[code] = { xs: [], ys: [] };
        byClass[code].xs.push(p.x);
        byClass[code].ys.push(p.y);
      });

      const classes = Object.keys(byClass);
          classes.forEach(code => {
      const xs = byClass[code].xs;
      const ys = byClass[code].ys;
      const n  = xs.length;
      if (!n) return;

      // centroid
      const cx = xs.reduce((a,b) => a + b, 0) / n;
      const cy = ys.reduce((a,b) => a + b, 0) / n;

      // covariance matrix
      let sxx = 0, syy = 0, sxy = 0;
      for (let i = 0; i < n; i++) {
        const dx = xs[i] - cx;
        const dy = ys[i] - cy;
        sxx += dx * dx;
        syy += dy * dy;
        sxy += dx * dy;
      }
      if (n > 1) {
        sxx /= (n - 1);
        syy /= (n - 1);
        sxy /= (n - 1);
      }

      // eigenvalues of 2x2 covariance matrix
      const trace = sxx + syy;
      const det   = sxx * syy - sxy * sxy;
      const disc  = Math.max(trace * trace / 4 - det, 0);
      const root  = Math.sqrt(disc);
      let eig1 = trace / 2 + root; // largest
      let eig2 = trace / 2 - root; // smallest
      if (eig1 < eig2) {
        const tmp = eig1; eig1 = eig2; eig2 = tmp;
      }

      // eigenvector for largest eigenvalue (orientation of major axis)
      let vx, vy;
      if (Math.abs(sxy) > 1e-12) {
        vx = eig1 - syy;
        vy = sxy;
      } else {
        if (sxx >= syy) {
          vx = 1; vy = 0;
        } else {
          vx = 0; vy = 1;
        }
      }
      const norm = Math.sqrt(vx*vx + vy*vy) || 1.0;
      vx /= norm;
      vy /= norm;

      // second eigenvector is perpendicular
      const ux = -vy;
      const uy =  vx;

      // project all points into this basis and find extremes
      const majors = new Array(n);
      const minors = new Array(n);
      let maxMajor = 0;
      let maxMinor = 0;
      for (let i = 0; i < n; i++) {
        const dx = xs[i] - cx;
        const dy = ys[i] - cy;
        const projMajor = dx * vx + dy * vy; // along (vx,vy)
        const projMinor = dx * ux + dy * uy; // along (ux,uy)
        majors[i] = projMajor;
        minors[i] = projMinor;
        const aAbs = Math.abs(projMajor);
        const bAbs = Math.abs(projMinor);
        if (aAbs > maxMajor) maxMajor = aAbs;
        if (bAbs > maxMinor) maxMinor = bAbs;
      }

      // compute how much we need to scale the axes so that
      // (u^2 + v^2) <= 1 for all points, where u = major/maxMajor, v = minor/maxMinor
      let maxEllipse = 0;
      if (maxMajor === 0) maxMajor = 0.1;
      if (maxMinor === 0) maxMinor = 0.1;
      for (let i = 0; i < n; i++) {
        const u = majors[i] / maxMajor;
        const v = minors[i] / maxMinor;
        const val = u*u + v*v;
        if (val > maxEllipse) maxEllipse = val;
      }
      const baseScale = Math.sqrt(maxEllipse || 1);

      // final axis lengths with gentle padding
      const PADDING = 1.05;
      const a = maxMajor * baseScale * PADDING;
      const b = maxMinor * baseScale * PADDING;

      // build ellipse points (x = cx + a*cos t * v + b*sin t * u)
      const nSeg = 80;
      const exs = [];
      const eys = [];
      for (let k = 0; k <= nSeg; k++) {
        const t = 2 * Math.PI * (k / nSeg);
        const cosT = Math.cos(t);
        const sinT = Math.sin(t);
        const px = cx + a * cosT * vx + b * sinT * ux;
        const py = cy + a * cosT * vy + b * sinT * uy;
        exs.push(px);
        eys.push(py);
      }

      const color = CLASS_COLORS[code] || '#999999';

      // ellipse outline
      traces.push({
        x: exs,
        y: eys,
        type: 'scatter',
        mode: 'lines',
        line: { width: 2, color: color },
        name: 'Class ' + code + ' region',
        hoverinfo: 'skip',
        showlegend: false
      });

      // place label slightly outside along major axis
      const labelOffset = 1.05;
      const labelX = cx + a * labelOffset * vx;
      const labelY = cy + a * labelOffset * vy;

      traces.push({
        x: [labelX],
        y: [labelY],
        type: 'scatter',
        mode: 'text',
        text: ['Class ' + code],
        textposition: 'middle center',
        textfont: { color: '#000000', size: 12 },
        hoverinfo: 'skip',
        showlegend: false
      });
    });

    }

    // >>> these two lines were missing <<<
    return traces;
  }


  /* ---------- data + rendering ---------- */

  let datasets = {
    sequence: [],
    inactive: [],
    active:   []
  };
  let currentDataset = 'sequence';
  let colorKey = 'Class';
  let shapeKey = 'None';

  function datasetTitle(ds) {
    if (ds === 'sequence') return 'Sequence similarity';
    if (ds === 'inactive') return 'Inactive structures';
    if (ds === 'active')   return 'Active structures';
    return '';
  }

  function render() {
    const pts = datasets[currentDataset] || [];
    if (!pts.length) {
      statusEl.textContent = 'No data for ' + currentDataset;
      return;
    }
    statusEl.textContent = '';

    plotTitleEl.textContent = datasetTitle(currentDataset);

    const traces = buildTraces(pts, colorKey, shapeKey);
    const layout = {
      xaxis: { visible: false, showgrid: false, scaleanchor: 'y' },
      yaxis: { visible: false, showgrid: false },
      hovermode: 'closest',
      legend: {
        x: 1.02,
        xanchor: 'left',
        y: 0.5,
        orientation: 'v',
        font: { family: 'Source Code Pro, monospace' }
      },
      margin: { l: 40, r: 220, t: 10, b: 40 },
      paper_bgcolor: '#fff',
      plot_bgcolor: '#fff'
    };

    Plotly.react(plotDiv, traces, layout, { displayModeBar: true, responsive: true });
    requestAnimationFrame(() => {
      try { Plotly.Plots.resize(plotDiv); } catch (e) {}
    });
  }

  /* ---------- UI wiring ---------- */

  // dataset toggle
  document.querySelectorAll('.dataset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ds = btn.getAttribute('data-dataset');
      if (!ds || ds === currentDataset) return;
      document.querySelectorAll('.dataset-btn').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-default');
      });
      btn.classList.remove('btn-default');
      btn.classList.add('btn-primary');
      currentDataset = ds;
      render();
    });
  });

  // colour-by
  document.querySelectorAll('.colorby').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.colorby').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-default');
      });
      btn.classList.remove('btn-default');
      btn.classList.add('btn-primary');
      colorKey = btn.getAttribute('data-key') || 'Class';
      render();
    });
  });

  // shape-by (None / Class)
  document.querySelectorAll('.shapeby').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-key') || 'None';
      if (key === shapeKey) return;
      document.querySelectorAll('.shapeby').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-default');
      });
      btn.classList.remove('btn-default');
      btn.classList.add('btn-primary');
      shapeKey = key;
      render();
    });
  });

  // class regions toggle
  regionBtn.addEventListener('click', () => {
    const active = regionBtn.getAttribute('data-active') === '1';
    if (active) {
      regionBtn.setAttribute('data-active', '0');
      regionBtn.classList.remove('btn-primary');
      regionBtn.classList.add('btn-default');
      regionBtn.textContent = 'Off';
      showClassRegions = false;
    } else {
      regionBtn.setAttribute('data-active', '1');
      regionBtn.classList.remove('btn-default');
      regionBtn.classList.add('btn-primary');
      regionBtn.textContent = 'On';
      showClassRegions = true;
    }
    render();
  });

  window.addEventListener('resize', () => {
    try { Plotly.Plots.resize(plotDiv); } catch (e) {}
  });

  /* ---------- initial load (single fetch) ---------- */

  try {
    statusEl.textContent = 'Loading data…';
    const res = await fetch(EMBED_URL, { headers: { 'Accept': 'application/json' }});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    datasets.sequence = (data.sequence && data.sequence.points) || [];
    datasets.inactive = (data.structure && data.structure.inactive && data.structure.inactive.points) || [];
    datasets.active   = (data.structure && data.structure.active   && data.structure.active.points)   || [];

    // --- cosmetic transforms to align with sequence embedding ---

    // Active: flip vertically only (your choice)
    datasets.active.forEach(p => {
      p.y = -p.y;
    });

    // Inactive: flip horizontally AND vertically
    datasets.inactive.forEach(p => {
      p.x = -p.x;
      p.y = -p.y;
    });

    statusEl.textContent = '';
    render();
  } catch (e) {
    console.error('Initial load error:', e);
    statusEl.textContent = 'Failed to load data: ' + e.message;
  }

})();

  

</script>
{% endblock %}
